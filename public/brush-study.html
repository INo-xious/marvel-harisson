<canvas id="painting" tabindex="0" aria-label="Watercolor room with live Osaka sunlight. Move your pointer across the painting to gently stir its colors. Arrow keys change the view. Shift and arrow keys brush the paint."></canvas>
<header><h1>a little room.</h1><p>Osaka · a changing light</p></header>
<div id="status" role="status">Preparing the painting…</div>
<footer aria-label="Room light and view controls">
 <div class="row"><span id="phase">Daylight</span><span class="time" id="time"></span><button id="lamp" aria-pressed="true">Lamp on</button><button id="live">Live time</button></div>
 <label for="hour" hidden>Preview time of day</label><input id="hour" aria-label="Preview time of day" type="range" min="0" max="1439" step="1">
 <div class="row">
  <div class="presets"><button data-phase="dawn">Dawn</button><button data-phase="day">Day</button><button data-phase="sunset">Sunset</button><button data-phase="night">Night</button></div>
  <div class="view" aria-label="Viewing angle"><button data-view="left" aria-label="View room from left">←</button><button data-view="center" aria-label="Center room view">View</button><button data-view="right" aria-label="View room from right">→</button></div>
  <details><summary>Save</summary><div class="exports"><button id="record">Save motion preview</button><button id="record-cycle">Save day cycle</button><button id="record-horizon">Save sunset &amp; moon</button></div></details>
 </div>
 <small>Move through the room · brush across the paint · let the washes settle</small>
</footer>
